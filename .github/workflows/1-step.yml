name: Step 1

on:
  # Manual re-run for facilitators and testing.
  workflow_dispatch:
  # The learner pushes the proposal to a branch that does not exist in the template.
  push:
    branches:
      - first-spec
    paths:
      - openspec/changes/**

# Least privilege: no default permissions; each job asks only for what it uses.
permissions: {}

# A quick second push cancels the run it supersedes instead of grading twice.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  STEP_2_FILE: ".github/steps/2-step.md"

jobs:
  find_exercise:
    name: Find Exercise Issue
    permissions:
      issues: read # locate the exercise issue
    uses: skills/exercise-toolkit/.github/workflows/find-exercise-issue.yml@v0.9.3

  check_step_work:
    name: Check step work
    runs-on: ubuntu-latest
    needs: [find_exercise]
    permissions:
      contents: read # read the learner's files
      issues: write # update Mona's feedback comment
      # No actions: write. A learner-triggered job must not enable or disable workflows.
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get response templates
        uses: actions/checkout@v6
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.9.3

      - name: Find last comment
        id: find-last-comment
        uses: peter-evans/find-comment@v4
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-author: github-actions[bot] # never target the learner's own comment
          direction: last

      - name: Update comment - checking work
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-last-comment.outputs.comment-id }}
          file: exercise-toolkit/markdown-templates/step-feedback/checking-work.md
          edit-mode: replace

      # START: Check practical exercise
      # The learner names the change, so each check first finds the single change folder.
      # Proposal checks ignore blank lines and single-line HTML comments.

      - name: Check there is exactly one change folder
        id: check-change-folder
        continue-on-error: true
        run: |
          dirs=$(find openspec/changes -mindepth 1 -maxdepth 1 -type d ! -name archive 2>/dev/null | sort || true)
          echo "Change folders: ${dirs:-none}"
          [ "$(echo "$dirs" | grep -c .)" -eq 1 ]

      - name: Check the proposal explains why
        id: check-why
        continue-on-error: true
        run: |
          dir=$(find openspec/changes -mindepth 1 -maxdepth 1 -type d ! -name archive 2>/dev/null | sort || true)
          [ "$(echo "$dir" | grep -c .)" -eq 1 ] || { echo "Expected one change folder, found: ${dir:-none}"; exit 1; }
          [ -f "$dir/proposal.md" ] || { echo "No proposal.md in $dir"; exit 1; }
          section() { tr -d '\r' < "$dir/proposal.md" | awk -v re="$1" 'tolower($0) ~ ("^## +(" re ")([^a-z]|$)") {f = 1; next} /^##? / {f = 0} f' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//' | grep -v -e '^$' -e '^<!--' || true; }
          text=$(section "why")
          echo "Why: ${#text} characters"
          [ "${#text}" -ge 50 ]

      - name: Check the proposal says what changes
        id: check-what-changes
        continue-on-error: true
        run: |
          dir=$(find openspec/changes -mindepth 1 -maxdepth 1 -type d ! -name archive 2>/dev/null | sort || true)
          [ "$(echo "$dir" | grep -c .)" -eq 1 ] || { echo "Expected one change folder, found: ${dir:-none}"; exit 1; }
          [ -f "$dir/proposal.md" ] || { echo "No proposal.md in $dir"; exit 1; }
          section() { tr -d '\r' < "$dir/proposal.md" | awk -v re="$1" 'tolower($0) ~ ("^## +(" re ")([^a-z]|$)") {f = 1; next} /^##? / {f = 0} f' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//' | grep -v -e '^$' -e '^<!--' || true; }
          text=$(section "what changes?")
          echo "What Changes: ${#text} characters"
          [ "${#text}" -ge 10 ]

      - name: Check the proposal names its non-goals
        id: check-non-goals
        continue-on-error: true
        run: |
          dir=$(find openspec/changes -mindepth 1 -maxdepth 1 -type d ! -name archive 2>/dev/null | sort || true)
          [ "$(echo "$dir" | grep -c .)" -eq 1 ] || { echo "Expected one change folder, found: ${dir:-none}"; exit 1; }
          [ -f "$dir/proposal.md" ] || { echo "No proposal.md in $dir"; exit 1; }
          section() { tr -d '\r' < "$dir/proposal.md" | awk -v re="$1" 'tolower($0) ~ ("^## +(" re ")([^a-z]|$)") {f = 1; next} /^##? / {f = 0} f' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//' | grep -v -e '^$' -e '^<!--' || true; }
          text=$(section "non-? ?goals?|out of scope")
          echo "Non-goals: ${#text} characters"
          [ "${#text}" -ge 10 ]

      - name: Update comment - step results
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-last-comment.outputs.comment-id }}
          edit-mode: replace
          file: exercise-toolkit/markdown-templates/step-feedback/step-results-table.md
          # Tips render only when a check failed. Keep tip text free of single quotes.
          vars: |
            step_number: 1
            results_table:
              - description: "There is exactly one change folder under openspec/changes"
                passed: ${{ steps.check-change-folder.outcome == 'success' }}
              - description: "proposal.md has a Why section with at least 50 characters"
                passed: ${{ steps.check-why.outcome == 'success' }}
              - description: "proposal.md has a What Changes section with content"
                passed: ${{ steps.check-what-changes.outcome == 'success' }}
              - description: "proposal.md has a Non-goals section with content"
                passed: ${{ steps.check-non-goals.outcome == 'success' }}
            tips: ${{ contains(steps.*.outcome, 'failure') && '["Keep one folder for your option, such as openspec/changes/add-record-identification, and delete any other folder you created.", "Name the file proposal.md and use the headings ## Why, ## What Changes and ## Non-goals, each followed by your own text.", "Commit and push to the first-spec branch again."]' || '[]' }}
      # END: Check practical exercise

      - name: Fail job if not all checks passed
        if: contains(steps.*.outcome, 'failure')
        run: exit 1

  post_next_step_content:
    name: Post next step content
    needs: [find_exercise, check_step_work] # grading must gate progress
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout step content
      actions: write # disable this step and enable the next one
      issues: write # post step content and progress comments
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get response templates
        uses: actions/checkout@v6
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.9.3

      - name: Create comment - step finished
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/step-feedback/step-finished-prepare-next-step.md
          vars: |
            next_step_number: 2

      - name: Create comment - add step content
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: ${{ env.STEP_2_FILE }}
          vars: |
            login: ${{ github.actor }}
            full_repo_name: ${{ github.repository }}

      - name: Create comment - watching for progress
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/step-feedback/watching-for-progress.md

      - name: Disable current workflow and enable next one
        run: |
          gh workflow disable "${{ github.workflow }}"
          gh workflow enable "Step 2"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
